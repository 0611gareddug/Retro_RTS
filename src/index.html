<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1220">
<title>Retro RTS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<!--STYLE-->
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="topbar">
    <button class="tb" id="bMenu" title="메뉴 (Esc)"><i class="ic ic-menu"></i></button>
    <div class="stat" id="sMoney"><i class="ic ic-coin"></i><b>0</b><small>+0/초</small></div>
    <div class="stat" id="sPop"><i class="ic ic-pop"></i><b>0/4</b></div>
    <div class="stat" id="sEra"><i class="ic ic-castle"></i><div><b>부족 시대</b><div class="prog"><i></i></div></div></div>
    <button class="btn sm" id="bEraUp" data-tut="era">시대 발전</button>
    <div class="stat" id="sTime"><i class="ic ic-clock"></i><b>0:00</b></div>
    <div id="speedBox"><button class="tb" id="bPause" title="일시정지 (P)">II</button><button class="tb" id="bSpeed" title="배속">1x</button></div>
    <button class="tb" id="bChat" title="채팅" style="display:none"><i class="ic ic-chat"></i></button>
    <button class="tb" id="bFull" title="전체화면"><i class="ic ic-full"></i></button>
  </div>
  <div id="toasts"></div>
  <div id="side">
    <button class="sb" id="bSelMode" title="드래그 선택">선택</button>
    <button class="sb" id="bSelArmy" title="군대 전체 선택">군대</button>
    <button class="sb" id="bHome" title="본성으로">본성</button>
    <div id="groups"></div>
  </div>
  <div id="sandbox" class="hidden"></div>
  <div id="panel"></div>
  <div id="mmWrap"><canvas id="mm"></canvas></div>
  <div id="placeBar" class="hidden"><span id="placeInfo"></span><button class="btn ok" id="bPlaceOk">건설</button><button class="btn" id="bPlaceNo">취소</button></div>
  <div id="cmdHint" class="hidden"></div>
  <div id="chat" class="hidden"><div id="chatLog"></div><input id="chatIn" maxlength="80" placeholder="채팅 입력 후 Enter"></div>
  <div id="tut" class="hidden"><div id="tutStep"></div><div id="tutText"></div><button class="btn sm" id="tutSkip">튜토리얼 끝내기</button></div>
</div>

<div id="screens">
  <section id="scMenu" class="screen">
    <div class="title"><canvas id="titleArt"></canvas><h1>RETRO RTS</h1><p>중세 픽셀 전략</p></div>
    <div class="menuBtns">
      <button class="btn big" data-go="ai">AI 대전</button>
      <button class="btn big" data-go="online">온라인 대전</button>
      <button class="btn big" data-go="sandbox">샌드박스</button>
      <button class="btn big" data-go="tutorial">튜토리얼</button>
      <button class="btn big hidden" id="bContinue" data-go="continue">이어하기</button>
      <div class="row"><button class="btn" data-go="ach">도전과제</button><button class="btn" data-go="settings">설정</button><button class="btn" data-go="help">도움말</button></div>
    </div>
    <div class="ver"></div>
  </section>

  <section id="scSetup" class="screen hidden">
    <div class="card wide">
      <h2 id="setupTitle">AI 대전</h2>
      <label>세력 이름 <input id="inName" maxlength="10" placeholder="이름 입력"></label>
      <div class="lab">세력 색상</div><div id="colorPick" class="swatches"></div>
      <div class="lab">맵</div><div id="mapPick" class="maps"></div>
      <div id="diffRow"><div class="lab">AI 난이도</div><div id="diffPick" class="seg"></div></div>
      <div class="row end"><button class="btn" data-back>뒤로</button><button class="btn ok big" id="bStart">시작</button></div>
    </div>
  </section>

  <section id="scOnline" class="screen hidden">
    <div class="card wide">
      <h2>온라인 대전</h2>
      <div id="onJoin">
        <label>세력 이름 <input id="onName" maxlength="10" placeholder="이름 입력"></label>
        <div class="lab">세력 색상</div><div id="onColor" class="swatches"></div>
        <div class="row"><button class="btn ok big" id="bHost">방 만들기</button></div>
        <div class="row"><input id="onCode" maxlength="6" placeholder="방 코드 6자리" class="code"><button class="btn big" id="bJoin">참가</button></div>
        <p class="note">방장이 방 코드를 알려주면 친구가 입력해서 들어와요. 2~4명, 사람끼리만 대전해요.</p>
      </div>
      <div id="onLobby" class="hidden">
        <div class="codeBox">방 코드 <b id="lobCode">------</b></div>
        <div id="lobPlayers"></div>
        <div id="lobHost">
          <div class="lab">맵</div><div id="lobMap" class="maps small"></div>
          <div class="lab">방식</div><div id="lobTeam" class="seg"></div>
        </div>
        <div id="lobChat"><div id="lobLog"></div><input id="lobIn" maxlength="80" placeholder="채팅"></div>
        <div class="row end"><button class="btn" id="bLeave">나가기</button><button class="btn ok big" id="bLobStart">시작</button></div>
      </div>
      <div class="row end" id="onBack"><button class="btn" data-back>뒤로</button></div>
    </div>
  </section>

  <section id="scAch" class="screen hidden"><div class="card wide"><h2>도전과제</h2><div id="achList"></div><div id="achStats"></div><div class="row end"><button class="btn" data-back>뒤로</button></div></div></section>

  <section id="scSettings" class="screen hidden">
    <div class="card">
      <h2>설정</h2>
      <div class="lab">그래픽 품질</div><div id="setQ" class="seg"></div>
      <label>배경음악 <input type="range" id="setBgm" min="0" max="100"></label>
      <label>효과음 <input type="range" id="setSfx" min="0" max="100"></label>
      <label>UI 크기 <input type="range" id="setUi" min="80" max="160" step="10"></label>
      <label class="chk"><input type="checkbox" id="setShake"> 화면 흔들림</label>
      <div class="row end"><button class="btn ok" data-back>확인</button></div>
    </div>
  </section>

  <section id="scHelp" class="screen hidden"><div class="card wide"><h2>도움말</h2><div id="helpBody" class="help"></div><div class="row end"><button class="btn" data-back>뒤로</button></div></div></section>

  <section id="scResult" class="screen hidden">
    <div class="card wide"><h2 id="resTitle">승리!</h2><div id="resSub"></div><canvas id="resChart"></canvas><div id="resTable"></div><div id="resAch"></div>
      <div class="row end"><button class="btn ok big" id="bResMenu">메인 메뉴</button></div></div>
  </section>

  <section id="scPause" class="screen hidden overlay">
    <div class="card"><h2>메뉴</h2>
      <button class="btn big" id="bResume">계속하기</button>
      <button class="btn big" id="bSave">저장하기</button>
      <button class="btn big" id="bPauseSet">설정</button>
      <button class="btn big" id="bPauseHelp">도움말</button>
      <button class="btn big danger" id="bQuit">메인 메뉴로</button>
    </div>
  </section>

  <section id="scConfirm" class="screen hidden overlay"><div class="card"><p id="cfText"></p><div class="row end"><button class="btn" id="cfNo">아니요</button><button class="btn ok" id="cfYes">예</button></div></div></section>
  <section id="scLoading" class="screen hidden overlay"><div class="card"><p id="ldText">불러오는 중...</p></div></section>
</div>
<div id="rotate" class="hidden">기기를 가로로 돌리면 더 넓게 볼 수 있어요</div>
<!--SCRIPT-->
</body>
</html>
